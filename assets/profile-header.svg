    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48D8C8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#48D8C8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9DE8DC" stroke-opacity="0.055" stroke-width="1"/>
