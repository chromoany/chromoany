<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">chromoany — Build useful things. Make them feel considered.</title>
  <desc id="desc">A dark teal profile banner for chromoany, covering developer tools, icon design and algorithms.</desc>
  <defs>
